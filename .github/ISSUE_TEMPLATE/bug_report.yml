name: Bug report
description: Report a reproducible SledTrace failure or regression.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve SledTrace. Please avoid including secrets or private trace data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the failure and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest command or code sample that reproduces the issue.
      placeholder: |
        1. Start SledTrace with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Python SDK or CLI
        - Go Collector
        - Dashboard
        - Docker or local startup
        - Documentation
        - Unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SledTrace version or commit
      placeholder: 0.7.0 or git commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system and relevant Python, Go, Node.js, Docker, or browser versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste concise logs with credentials, tokens, and private trace data removed.
      render: shell
