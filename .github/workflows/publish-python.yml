name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      target:
        description: Validate artifacts or publish to a configured package index
        required: true
        default: validate
        type: choice
        options:
          - validate
          - testpypi
          - pypi
      ref:
        description: Git ref to build; publishing requires a v-prefixed tag matching the package version
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and validate package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_REF: ${{ inputs.ref }}
    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify publishing ref matches package version
        if: inputs.target != 'validate'
        working-directory: sdk/python
        shell: bash
        run: |
          if [[ "${RELEASE_REF}" != v* ]]; then
            echo "Publishing requires a v-prefixed tag, for example v0.7.0." >&2
            exit 1
          fi

          package_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          if [[ "${RELEASE_REF#v}" != "${package_version}" ]]; then
            echo "Tag ${RELEASE_REF} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Install package build tools
        working-directory: sdk/python
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        working-directory: sdk/python
        run: python -m build

      - name: Check PyPI package metadata
        working-directory: sdk/python
        run: python -m twine check dist/*

      - name: Upload validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package
          path: sdk/python/dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sledtrace
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package
          path: dist

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/sledtrace
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
