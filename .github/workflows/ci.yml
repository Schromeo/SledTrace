name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.13"
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build twine

      - name: Run Python SDK tests
        run: pytest -q

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check PyPI package metadata
        run: python -m twine check dist/*

      - name: Validate clean wheel install and CLI
        run: python scripts/validate-wheel.py

  collector:
    name: Go Collector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: collector/go
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: collector/go/go.mod
          cache-dependency-path: collector/go/go.sum

      - name: Run Collector tests
        run: go test ./... -count=1

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json

      - name: Install Dashboard dependencies
        run: npm ci

      - name: Build Dashboard
        run: npm run build
